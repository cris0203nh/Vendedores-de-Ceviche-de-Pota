name: "02 - DevSecOps Security"

on:
  push:
    branches: [main, "VDCP-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    name: Python - Bandit and pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar herramientas de seguridad
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Analisis estatico de seguridad
        run: bandit -r backend/app -ll

      - name: Auditar dependencias Python
        run: pip-audit -r backend/requirements.txt

  javascript-security:
    name: JavaScript - npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Auditar dependencias
        working-directory: frontend
        run: npm audit --audit-level=high

  secret-scanning:
    name: Deteccion de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar credenciales expuestas
        uses: gitleaks/gitleaks-action@v2
